<section class="todoapp">
  <header class="header">
    <div class="container">
      <h1>My Day</h1>
      <p>All my tasks in one place</p>
      <input
        class="new-todo"
        placeholder="Type new todo"
        autofocus
        type="text"
        [formControl]="newTaskCtl"
        (keydown.enter)="changeHandler()"
        />
    </div>
  </header>

  {{filter()}}

  <div class="container todoapp-wrapper">
    <!-- This section should be hidden by default and shown when there are todos -->
    <section class="main">
      <ul class="todo-list">
        @for (task of tasksByFilter(); track task; let i = $index) {
          <li (dblclick)="updateTastkEditingMode(i)" [class.editing]="task.editing===true" [class.complete]="task.completed===true" >
            <div class="view">
              <input class="toggle" type="checkbox" [checked]="task.completed" (click)="updateTask(i)"/>
              <label>{{task.title}}</label>
              <button class="destroy" (click)="deleteTask(task.id)"></button>
            </div>
            <input class="edit" [value]="task.title" (keydown.enter)="updateTastkText(i, $event)" />
          </li>
        }
        <!----
        <li>
          <div class="view">
            <input class="toggle" type="checkbox" />
            <label>Buy a unicorn</label>
            <button class="destroy"></button>
          </div>
          <input class="edit" value="Buy a unicorn" />
        </li>
        <li class="editing">
          <div class="view">
            <input class="toggle" type="checkbox" />
            <label>Make dishes</label>
            <button class="destroy"></button>
          </div>
          <input class="edit" value="Make dishes" />
        </li>
        -->
      </ul>
      <pre><code>{{tasksByFilter() | json}}</code></pre>

    </section>
    <!-- This footer should be hidden by default and shown when there are todos -->
    @if (tasks().length>0) {
      <footer class="footer">
        <!-- This should be `0 items left` by default -->
        <span class="todo-count"><strong>{{tasks().length}}</strong> item{{tasksByFilter().length === 1 ? '' : 's'}} left<span ></span></span>
        <!-- Remove this if you don't implement routing -->
        <ul class="filters">
          <li>
            <a (click) = "changeFilter('all')" [class.selected]="filter() === 'all'" >All</a>
          </li>
          <li>
            <a (click) = "changeFilter('pending')" [class.selected]="filter() === 'pending'">Pending</a>
          </li>
          <li>
            <a (click) ="changeFilter('completed')" [class.selected]="filter() === 'completed'">Completed</a>
          </li>
        </ul>
        <!-- Hidden if no completed items are left ↓ -->
        <button class="clear-completed">Clear completed</button>
      </footer>
    }
  </div>


</section>
